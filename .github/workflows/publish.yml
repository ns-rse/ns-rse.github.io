on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libproj-dev libgdal-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.2

      - name: Install Quarto Extensions
        run: |
          quarto install --no-prompt extension jmbuhr/quarto-qrcode
          quarto install --no-prompt extension mcanouil/quarto-elevator
          quarto install --no-prompt extension davidwilby/openlinksinnewpage
          quarto install --no-prompt extension schochastics/academicons

      - name: Install Python and Dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt
        if: steps.restore-virtualenv.outputs.cache-hit != 'true'

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
